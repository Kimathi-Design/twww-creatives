    <style>
        *, *:before, *:after {
  box-sizing: border-box;
  padding: 0;
  margin: 0;
}

body {
 /* background: #CCFBFE;*/
  overflow: hidden;
  font-family: sans-serif;
  margin:0;
  font-size:16px;
}


.tinder {
  width: 640px;
  height:360px;
  margin:auto;
  background: #e1e5eb;
  background:#f5f6f8;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  position: relative;
  opacity: 0;
  transition: opacity 0.1s ease-in-out;
}

.loaded.tinder {
  opacity: 1;
}

.tinder--status {
  position: absolute;
  top: 50%;
  margin-top: -50px;
  z-index: 10;
  width: 100%;
  text-align: center;
  pointer-events: none;
}

.tinder--status svg {
  font-size: 100px;
  opacity: 0;
  transform: scale(0.3);
  transition: all 0.2s ease-in-out;
  position: absolute;
  width: 100px;
  margin-left: -50px;
}
.tinder--status .fa-remove {
  margin-top:-18px;
}

.tinder_love .fa-heart {
  opacity: 0.7;
  transform: scale(1);
}

.tinder_nope .fa-remove {
  opacity: 0.7;
  transform: scale(1);
}

.tinder--cards {
  flex-grow: 1;
  text-align: center;
  padding-bottom:24px;
  display: flex;
  justify-content: center;
  align-items: flex-end;
  z-index: 1;
}

.size-640 .tinder--cards {
  padding-bottom:25px;
}

.tinder_love .tinder--cards {z-index:8;}
.tinder_nope .tinder--cards {z-index:8;}

.tinder--card {
  display: inline-block;
  width: 280px;
  border:9px solid white;
  height: 280px;
  background: #FFFFFF;
  box-shadow: 0 1px 2px 0 rgba(151,150,146,0.4), 0 2px 6px 0 rgba(151,150,146,0.4);
  box-shadow: 0 4px 6px rgba(50,50,93,.11), 0 1px 3px rgba(0,0,0,.08);
  padding-bottom: 0px;
  border-radius: 8px;
  overflow: hidden;
  position: absolute;
  will-change: transform;
  transition: all 0.3s ease-in-out;
  cursor: -webkit-grab;
  cursor: -moz-grab;
  cursor: grab;
}

.moving.tinder--card {
  transition: none;
  cursor: -webkit-grabbing;
  cursor: -moz-grabbing;
  cursor: grabbing;
  
}

.tinder--card img {
  max-width: 100%;
  pointer-events: none;
  border-radius:9px;
}


.explain-text-1 {
  left:22px;
  top:20px;
  position: absolute;
  color:#333;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif, "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol";
 font-size:15px;
}

.exp-title {
 font-weight:500; font-size:0.9rem;
}

.explain-2 {
  bottom:20px;
  right:22px;
  position:absolute;

}
.rotate-animation {  animation: rotate-90-cw 1.3s cubic-bezier(0.250, 0.460, 0.450, 0.940) both;
  animation-iteration-count: 1;}
.explain-2 {
  animation-play-state: running;  
}

  .explain-2 svg {
    fill: #6f8ab7!important;
    /*fill: rgb(61 81 112 / 65%)!important;*/
    fill: rgb(61 81 112 / 56%)!important;
  width:32px;
  height:32px;
  }
.tinder--buttons {
  border-radius: 50%;
  line-height: 60px;
  width: 60px;
  height: 60px;
  border: 0;
  box-shadow:1px 1px 10px rgba(0,0,0,.08);
  transition: box-shadow .5s, opacity .5s;
  background: #FFFFFF;
  display: inline-block;
  margin: 0 8px;
  cursor:pointer;
  display: flex;
  align-items: center;
  justify-content: center;
}
.tinder--buttons:hover {
  box-shadow: 1px 1px 1px rgba(0,0,0,.08);
  opacity:.9;
}

.tinder--buttons:after {
  content: "";
  display: block;
  position: absolute;
  border-radius: 4em;
  left: 0;
  top:0;
  width: 100%;
  height: 100%;
  opacity: 0;
  transition: all 0.5s;
  box-shadow: 0 0 10px 40px rgba(44, 43, 42, 0.1);
   }
   
   .tinder--buttons:active:after{
  box-shadow: 0 0 0 0 rgba(44, 43, 42, 0.1);
  position: absolute;
  border-radius: 4em;
  left: 0;
  top:0;
  opacity: 1;
  transition: 0s;
}

.tinder--buttons:focus {
  outline: 0;
}

.tinder--buttons i {
  font-size: 32px;
  vertical-align: middle;
}

.fa-heart {
  fill: #FFACE4!important;
  fill: #17c671!important;
}

.fa-remove {
  fill: #CDD6DD!important;
  fill: rgba(196, 24, 60, 0.86)!important;
}

#nope {position:absolute;  z-index:2;  left:20px; top:50%; transform:translateY(-50%); }
#nope svg {height:32px; width:32px;}
#love {position:absolute; 
  z-index:2;  right:20px; top:50%; transform:translateY(-50%); }
#love svg {height:32px; width:32px;}


.big {transform: scale(1)!important; opacity:1!important;}
.clicktag img {width:100%; height:100%; z-index:20; 
  object-fit:cover; position:absolute; transform: scale(0); 
  transition: transform .86s cubic-bezier(0.390, 0.575, 0.565, 1.000), opacity .86s cubic-bezier(0.390, 0.575, 0.565, 1.000);
opacity:0;}



@keyframes rotate-90-cw {
  0% {

            transform: rotate(0);
  }
  25% {

            transform: rotate(45deg) scale(1.14);
  }
  75% {

            transform: rotate(-45deg) scale(1.14);
  }
  100% {

transform: rotate(0deg);
}
}


.explain-text-3 {display:none;}


.tinder.size-320-480 {
  width: 320px;
    height: 480px;
    margin: auto;
}

.tinder.size-300-600 {
  width: 300px;
    height: 600px;

}
.size-320-480 .tinder--cards {
  padding-bottom:120px;
} 

.size-300-600 .tinder--cards {
  padding-bottom:190px;
} 

.size-320-480 .tinder--buttons, .size-300-600 .tinder--buttons {
  -webkit-tap-highlight-color: transparent;
    bottom: 30px;
    top: unset!important;
    transform: none!important;
  }


  .size-300-600 .tinder--buttons {bottom: 36px;}

  .size-320-480 #love,  .size-300-600 #love {right:16px; }
  .size-320-480 #nope,.size-300-600 #nope {
    left: 16px;
}
  .size-320-480 .explain-2 {right:31px; bottom:unset!important; top:18px;}

  .size-300-600 .explain-2 {right:31px; bottom:unset!important; top:33px;}

  .size-320-480 #love svg, .size-320-480 #nope svg,  .size-300-600 #love svg, .size-300-600 #nope svg  {width:32px; height:32px;}
  .size-320-480.tinder_love .explain-2 svg, .size-300-600.tinder_love .explain-2 svg {opacity:.5;}
  .size-320-480.tinder_nope .explain-2 svg, .size-300-600.tinder_love .explain-2 svg {opacity:.5;}

  .size-320-480 .explain-text-1, .size-300-600 .explain-text-1 {display: none;}

  .size-320-480 .explain-2 svg, .size-300-600 .explain-2 svg {
    width: 36px;
    height: 36px;
  }

.size-320-480 .explain-text-3, .size-300-600 .explain-text-3 {
  left: 0;

    font-size: 16px;
    font-weight: 500;
    line-height: 1.24;

    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif, "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol";
}


.size-300-600 .explain-text-3 {top:31px;  font-size: 17px;    opacity: .86;}
.size-320-480 .explain-text-3 span, .size-300-600 .explain-text-3 span  {
font-weight: 400;

  .size-320-480 #love svg, .size-320-480 #nope svg, .size-300-600 #love svg, .size-300-600 #nope svg {width:30px; height:30px;}

<script id="mediapal-idle-autoscroll">
(function () {
  var IDLE_MS = 3000;
  var timer = null;
  function remaining() {
    return document.querySelectorAll(".tinder--card:not(.removed)");
  }
  function advance() {
    var cards = remaining();
    if (!cards.length) return;
    var love = document.getElementById("love");
    if (love) love.click();
    arm();
  }
  function arm() {
    clearTimeout(timer);
    if (!remaining().length) return;
    timer = setTimeout(advance, IDLE_MS);
  }
  ["pointerdown", "touchstart", "mousedown", "keydown", "wheel"].forEach(function (ev) {
    document.addEventListener(ev, arm, true);
  });
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", arm);
  else arm();
})();
</script>
