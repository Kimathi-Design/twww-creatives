		body{
			margin: 0;

		.wrapper{
			position: absolute;
			width: 300px;
			height: 600px;
			top: 0;
			left: 0;
			overflow: hidden;
			cursor: pointer;
			opacity: 0;
		}

		@font-face {
			font-family: 'Montserrat';
			src: url('assets/724741_Montserrat.ttf');
		}

		.bg, .logo, .inbg, .el_1, .el_2, .el_3, .el_4, .el_5, .el_6, .el_7, .inbt, .incta, .outhnd, .outexpl, .outcp, .outcta, .ins{
			position: absolute;
			width: 300px;
			height: 600px;
			top: 0;
			left: 0;
			pointer-events: none;

		}

		.logo{
			z-index: 40;
			background-repeat: no-repeat;
			background-position: center top;
			background-size: 300px 600px;
		}

		.outhnd{
			transform-origin: 50% 100%;
		}

		.ins{
			transform-origin: 50% 390px;
		}

		.inbg{
			background-color: #000000;
		}

		.sunbg{
			position: absolute;
			width: 300px;
			height: 100px;
			left: 0;
			top: 0;
			background-position: 50% 0;
			background-size: cover;
			overflow: hidden;
		}

		.game_cn, .track{
			position: absolute;
			width: 300px;
			height: 480px;
			bottom: 0;
			left: 0;
			right: 0;
			margin: 0 auto;

			background-size: cover;
			background-position: 50% 0;
		}

		.game_cn{
			overflow: hidden;
		}

		.fanhit{
			position: absolute;
			width: 42px;
			height: 40px;
			bottom: 7px;
			left: 20px;
		}

		.coke, .tr_1, .tr_2{
			position: absolute;
			width: 64px;
			height: 233px;
			bottom: 0;
			left: -10px;
			right: -10px;
			margin: 0 auto;
		}

		.pn_1_inst, .pn_2_inst, .pn_3_inst, .bn_inst, .em_inst{
			position: absolute;
			width: 53px;
			height: 71px;
			top: 0;
			left: 0; 
		}

		.spl{
			position: absolute;
			width: 116px;
			height: 90px;
			bottom: 20px;
			left: -10px;
			opacity: 0;
		}

		.score{
			position: absolute;
			width: 34px;
			height: 22px;
			left: 0;
			right: 0;
			margin: 0 auto;
			top: 90px;

			font-family: Montserrat, Arial;
			font-size: 24px;
			text-align: center;
			line-height: 20px;
			color: #ffffff;

		}

		.endscore{
			position: absolute;
			width: 300px;
			left: 0;
			top: 68px;
			font-family: Montserrat, Arial;
			font-size: 13px;
			font-weight: 600;
			letter-spacing: 0.08em;
			text-align: center;
			line-height: 1.15;
			color: #ffffff;
			opacity: 1;
			visibility: hidden;
			pointer-events: none;
			z-index: 60;
		}

		.endscore .endscore-num{
			display: block;
			margin-top: 4px;
			font-size: 40px;
			font-weight: 700;
			letter-spacing: 0;
			color: #E61A27;
			text-shadow: 0 1px 0 rgba(255,255,255,0.35);
		}
