  <style>
    html, body {
      margin: 0;

  <script data-id="FORCE_ONE_DEVICE">
(function () {
  /* One layout path everywhere (AdCanvas forks on UA otherwise). */
  var UA = 'Mozilla/5.0 (iPhone; CPU iPhone OS 17_0 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/17.0 Mobile/15E148 Safari/604.1';
  try {
    Object.defineProperty(navigator, 'userAgent', { configurable: true, get: function () { return UA; } });
    Object.defineProperty(navigator, 'platform', { configurable: true, get: function () { return 'iPhone'; } });
    Object.defineProperty(navigator, 'maxTouchPoints', { configurable: true, get: function () { return 5; } });
    Object.defineProperty(window, 'devicePixelRatio', { configurable: true, get: function () { return 1; } });
    Object.defineProperty(window, 'innerWidth', { configurable: true, get: function () { return 640; } });
    Object.defineProperty(window, 'innerHeight', { configurable: true, get: function () { return 1040; } });
  } catch (e) {}
})();
</script>
  <script data-id="ANALYTICS_BLOCK">
(function () {
  function isBlocked(url) {
    return /analytics\.adcanvas\.com|aam\.a47b\.com|google-analytics|doubleclick|googletagmanager/i.test(String(url||''));
  }
  function blockUrl(url) { return isBlocked(url) ? 'data:,' : url; }
  var _fetch = window.fetch;
  if (_fetch) {
    window.fetch = function (input, init) {
      var url = typeof input === 'string' ? input : (input && input.url);
      if (isBlocked(url)) return Promise.resolve(new Response('', {status: 204}));
      return _fetch.apply(this, arguments);
    };
  }
  var open = XMLHttpRequest.prototype.open;
  XMLHttpRequest.prototype.open = function (method, url) {
    if (isBlocked(url)) { this.send = function(){}; return; }
    return open.apply(this, arguments);
  };
  var _img = Object.getOwnPropertyDescriptor(HTMLImageElement.prototype, 'src');
  if (_img && _img.set) {
    Object.defineProperty(HTMLImageElement.prototype, 'src', {
      configurable: true, enumerable: true, get: _img.get,
      set: function (v) { return _img.set.call(this, blockUrl(v)); }
    });
  }
  var sa = Element.prototype.setAttribute;
  Element.prototype.setAttribute = function (name, value) {
    if (String(name).toLowerCase() === 'src') value = blockUrl(value);
    return sa.call(this, name, value);
  };
  if (navigator.sendBeacon) {
    var sb = navigator.sendBeacon.bind(navigator);
    navigator.sendBeacon = function (url, data) {
      if (isBlocked(url)) return true;
      return sb(url, data);
    };
  }
})();
</script>
  <script data-id="LOCK_AND_REVEAL">
(function () {
  var W = 640, H = 1040, done = false;
  function lock() {
    try {
      var n = window.nexd;
      if (!n) return;
      if (n.device) {
        n.device.isDesktop = false;
        n.device.isDesktopReal = false;
        n.device.isMobile = true;
      }
      if (n.options) {
        n.options.width = W;
        n.options.height = H;
        n.options.responsive = false;
        n.options.interstitial = false;
        n.options.stayincontainer = true;
      }
      if (n.framework) {
        n.framework.viewWidth = W;
        n.framework.viewHeight = H;
      }
      var unit = document.querySelector('.adc-ad, .adc-inner, .mainContent');
      if (unit) {
        unit.style.width = W + 'px';
        unit.style.height = H + 'px';
      }
      var c = document.querySelector('canvas');
      if (c) {
        c.style.width = W + 'px';
        c.style.height = H + 'px';
        if (c.width !== W) c.width = W;
        if (c.height !== H) c.height = H;
      }
    } catch (e) {}
  }
  function reveal() {
    if (done) return;
    var c = document.querySelector('canvas');
    if (!c) return;
    lock();
    done = true;
    document.documentElement.classList.remove('adc-pending');
    document.documentElement.classList.add('adc-ready');
  }
  document.addEventListener('nexd.framework.loaded', function () {
    lock();
    setTimeout(reveal, 100);
  });
  document.addEventListener('nexd.ad.rendered', function () {
    lock();
    setTimeout(reveal, 40);
  });
  var n = 0;
  var iv = setInterval(function () {
    lock();
    reveal();
    if (done || ++n > 100) clearInterval(iv);
  }, 40);
  setTimeout(function () {
    if (!done) {
      lock();
      done = true;
      document.documentElement.classList.remove('adc-pending');
      document.documentElement.classList.add('adc-ready');
    }
  }, 3500);
})();
</script>
  <script data-id="LOCK_SCROLL">
(function () {
  function stop(e) { e.preventDefault(); }
  document.addEventListener('touchmove', stop, { passive: false });
  document.addEventListener('gesturestart', stop, { passive: false });
  try {
    document.body && (document.body.style.overflow = 'hidden');
    document.documentElement.style.overflow = 'hidden';
  } catch (e) {}
})();
</script>
